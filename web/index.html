<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie RNBO</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    /* Video lamp: fullscreen behind controls; brightness + invert driven by app.js */
    #video-lamp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 100;
      display: block;
    }
    /* Signal lamp: black at 0, bright glow at 1 (driven in app.js); soft edge via blur */
    #dump-led {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(calc(126px / 1.5), calc(27vmin / 1.5), calc(198px / 1.5));
      height: clamp(calc(126px / 1.5), calc(27vmin / 1.5), calc(198px / 1.5));
      border-radius: 50%;
      background: #000;
      opacity: 1;
      box-shadow: none;
      filter: blur(calc(18px / 1.5));
      -webkit-filter: blur(calc(18px / 1.5));
      pointer-events: none;
      z-index: 100;
      transition: none;
      display: none;
    }
    #scope-wrap {
      position: fixed;
      left: 50%;
      bottom: clamp(12px, 4vmin, 28px);
      transform: translateX(-50%);
      width: 60px;
      height: 15px;
      max-width: calc(100vw - 24px);
      z-index: 99;
      pointer-events: none;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.42);
    }
    #scope {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 60;
      max-width: 85vw;
    }
    #ui-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 2;
    }
  </style>
</head>
<body>
  <video id="video-lamp" src="../3rd.mov" autoplay loop muted playsinline aria-hidden="true"></video>
  <div id="dump-led" aria-hidden="true"></div>
  <div id="scope-wrap"><canvas id="scope" width="840" height="176"></canvas></div>
  <p id="status">Loading…</p>
  <iframe id="ui-frame" title="Controls" src="./min-rnbo-ui.html?embed=1"></iframe>

  <script src="app.js"></script>
</body>
</html>
