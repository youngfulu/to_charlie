<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie RNBO</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    /* Brightness indicator: ~3× previous size, centered (square frame, circular lamp) */
    #dump-led {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(126px, 27vmin, 198px);
      height: clamp(126px, 27vmin, 198px);
      border-radius: 50%;
      background: #fff;
      opacity: 0.2;
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.12s ease-out, box-shadow 0.12s ease-out;
    }
    /* Waveform: fixed pixel size, below center line */
    #scope-wrap {
      position: fixed;
      left: 50%;
      bottom: clamp(12px, 4vmin, 28px);
      transform: translateX(-50%);
      width: 720px;
      height: 120px;
      max-width: calc(100vw - 24px);
      z-index: 99;
      pointer-events: none;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.42);
    }
    #scope {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 60;
      max-width: 85vw;
    }
    #ui-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="dump-led" aria-hidden="true"></div>
  <div id="scope-wrap"><canvas id="scope" width="840" height="176"></canvas></div>
  <p id="status">Loading…</p>
  <iframe id="ui-frame" title="Controls" src="./min-rnbo-ui.html?embed=1"></iframe>

  <script src="app.js"></script>
</body>
</html>
