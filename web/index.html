<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Charlie RNBO</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color-scheme: only light;
    }
    #status {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 60;
      max-width: 85vw;
    }
    #ui-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 200;
    }
    #start-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300;
      background: none;
      border: none;
      padding: 0;
      color: rgba(255, 255, 255, 0.45);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 0.2s ease, opacity 0.4s ease;
    }
    #start-btn:hover { color: rgba(255, 255, 255, 0.85); }
    #start-btn.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <button id="start-btn">what was that day ?</button>
  <p id="status">Loading…</p>
  <iframe id="ui-frame" title="Controls" src="./min-rnbo-ui.html?embed=1" allowtransparency="true"></iframe>

  <script>
    document.getElementById("start-btn").addEventListener("click", function () {
      var btn = this;
      /* iOS: call resume() synchronously in gesture handler before any async */
      if (window.charlieResumeAudio) window.charlieResumeAudio();
      var f = document.getElementById("ui-frame");
      var vid = f && f.contentDocument && f.contentDocument.getElementById("video-lamp");
      /* Unlock video element for iOS autoplay in gesture context; display stays hidden
         until buffers are ready (app.js sets display:block + plays when done loading). */
      if (vid) vid.play().then(function () { vid.pause(); vid.currentTime = 0; }).catch(function () {});
      btn.classList.add("gone");
      setTimeout(function () { btn.style.display = "none"; }, 450);
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
